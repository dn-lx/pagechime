name: Application
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          APP_REVISION: ${{ github.sha }}
      - run: npm run check:budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:mobile
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
