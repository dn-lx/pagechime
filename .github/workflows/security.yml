name: Security checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: security / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/repo --redact --exit-code 1

  semgrep:
    name: security / semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.178.0'
      - name: Scan high-severity findings
        run: semgrep scan --config auto --severity ERROR --error

  dependency-audit:
    name: security / dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit deployed web and shared-core dependencies
        shell: bash
        run: |
          if [ -f package.json ]; then
            if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
              echo "::error::package.json has no committed npm lockfile. Commit a lockfile or adapt this audit job to the project's package manager."
              exit 1
            fi
            npm audit --workspace @pagechime/web --workspace @pagechime/core --omit=dev --audit-level=high
          else
            echo "No package.json; skipping npm audit."
          fi
      - name: Audit Python requirements when present
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
            pip-audit -r requirements.txt
          else
            echo "No root requirements.txt; skipping pip-audit."
          fi

  native-tooling-audit:
    name: security / native-tooling-advisory (tracked REQ-005)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Report unresolved Expo CLI advisory
        run: npm audit --omit=dev --audit-level=high
      - name: Explain scope and native release gate
        if: always()
        run: echo 'Full tooling audit is intentionally visible; see docs/SECURITY-REVIEW.md and REQ-005. Web audit remains blocking. Signed native/OTA release requires renewed review.'
