name: Agent reliability

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: quality / evidence-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify complete starter on Linux
        if: runner.os == 'Linux'
        run: node scripts/verify.mjs --profile starter --run --out starter-checks.json
      - name: Test evidence tools on Windows
        if: runner.os == 'Windows'
        run: node --test tests/verification.test.mjs tests/agent-evals.test.mjs tests/partner-commands.test.mjs tests/entrypoint.test.mjs
      - name: Validate Windows command adapters
        if: runner.os == 'Windows'
        run: node scripts/sync-partner-commands.mjs
      - name: Linux failure diagnostics (original failure remains blocking)
        if: failure() && runner.os == 'Linux'
        run: node scripts/test-starter.mjs
      - name: Preserve revision-bound command evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starter-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-artifacts/starter-checks.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
